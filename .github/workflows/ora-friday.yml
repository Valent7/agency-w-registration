name: Ora - Friday reflections in WREMYA

# Only a schedule runner. Agency W app code and deployments are not modified.
on:
  schedule:
    # Friday 19:07 UTC = 21:07 Berlin summer / 20:07 Berlin winter.
    - cron: "7 19 * * 5"

permissions:
  contents: none

concurrency:
  group: ora-friday-wremya
  cancel-in-progress: false

jobs:
  evening-thoughts:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Ask independent Ora service to publish its Friday reflection
        env:
          ORA_WEEKEND_URL: https://ora-wremya-pilot.onrender.com/schedule/weekend
        shell: bash
        run: |
          set -euo pipefail
          # Signed OIDC token is issued for this exact GitHub workflow, not a Telegram secret.
          OIDC_JSON="$(curl --silent --show-error --fail --max-time 30 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ora-wremya-pilot.onrender.com")"
          OIDC_TOKEN="$(printf "%s" "$OIDC_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          # The free Render instance may take a minute to wake after inactivity.
          curl --silent --show-error --fail --max-time 210 \
            -X POST -H "Authorization: Bearer ${OIDC_TOKEN}" "$ORA_WEEKEND_URL"
