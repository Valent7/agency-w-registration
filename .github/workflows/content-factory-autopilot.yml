name: Content factory autopilot
# Covers Content Studio integrations such as the Suno music bridge.

on:
  pull_request:
    paths:
      - "content_factory_*.py"
      - "content_studio_*.py"
      - "agency_outro.py"
      - "content_factory_setup.sql"
      - "requirements*.txt"
      - "tests/test_content_factory_*.py"
      - "tests/test_content_studio_*.py"
      - ".github/workflows/content-factory-autopilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/agency-w-pycache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install media tools and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -r requirements.txt -r requirements_worker.txt opencv-python-headless==4.12.0.88
          python -m pip check
      - name: Compile application and worker
        run: python -m compileall -q .
      - name: Run offline regression and real media tests
        run: python -m unittest discover -s tests -v
