name: Instagram manual scout offline tests
on:
  pull_request:
    paths:
      - "instagram_manual_scout.py"
      - "instagram_radar_ui.py"
      - "tests/test_instagram_manual_scout.py"
      - ".github/workflows/instagram-manual-scout.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax only (no service or credentials)
        run: python -m py_compile instagram_manual_scout.py instagram_radar_ui.py tests/test_instagram_manual_scout.py
      - name: Test strict URLs and draft requirements offline
        run: python -m unittest discover -s tests -p "test_instagram_manual_scout.py" -v
