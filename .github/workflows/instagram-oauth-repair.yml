name: Instagram OAuth and Direct identity regression
on:
  pull_request:
    paths:
      - "instagram_webhook.py"
      - "instagram_auth_tools.py"
      - "streamlit_app.py"
      - "tests/test_instagram_oauth_repair.py"
      - ".github/workflows/instagram-oauth-repair.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instagram-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install read-only mock test dependencies
        run: python -m pip install requests
      - name: Compile webhook and interface without executing them
        run: python -m py_compile instagram_webhook.py instagram_auth_tools.py streamlit_app.py tests/test_instagram_oauth_repair.py
      - name: Offline OAuth, provider-verified account identity and Direct mapping
        run: python -m unittest discover -s tests -p "test_instagram_oauth_repair.py" -v
