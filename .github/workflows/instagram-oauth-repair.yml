name: Instagram OAuth and Direct identity regression
on:
  pull_request:
    paths:
      - "instagram_webhook.py"
      - "instagram_auth_tools.py"
      - "instagram_auth_handoff.py"
      - "streamlit_app.py"
      - "content_factory_runtime.py"
      - "content_factory_store.py"
      - "content_factory_autopilot_ui.py"
      - "tests/test_content_factory_runtime.py"
      - "tests/test_content_factory_autopilot_ui.py"
      - "tests/test_content_factory_store.py"
      - "tests/test_instagram_oauth_repair.py"
      - "tests/test_instagram_auth_handoff.py"
      - "tests/test_instagram_native_identity.py"
      - "tests/test_instagram_partner_onboarding.py"
      - "docs/instagram_partner_launch.md"
      - ".github/workflows/instagram-oauth-repair.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instagram-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install read-only mock test dependencies
        run: python -m pip install requests cryptography starlette Pillow streamlit
      - name: Compile webhook and interface without executing them
        run: python -m py_compile instagram_webhook.py instagram_auth_tools.py instagram_auth_handoff.py content_factory_runtime.py content_factory_store.py content_factory_autopilot_ui.py streamlit_app.py tests/test_content_factory_runtime.py tests/test_content_factory_store.py tests/test_content_factory_autopilot_ui.py tests/test_instagram_oauth_repair.py tests/test_instagram_auth_handoff.py tests/test_instagram_native_identity.py tests/test_instagram_partner_onboarding.py
      - name: Offline OAuth, provider-verified account identity and Direct mapping
        run: |
          python -m unittest discover -s tests -p "test_instagram_oauth_repair.py" -v
          python -m unittest discover -s tests -p "test_instagram_auth_handoff.py" -v
          python -m unittest discover -s tests -p "test_instagram_native_identity.py" -v
          python -m unittest discover -s tests -p "test_instagram_partner_onboarding.py" -v
          python -m unittest discover -s tests -p "test_content_factory_runtime.py" -v
          python -m unittest discover -s tests -p "test_content_factory_store.py" -v
          python -m unittest discover -s tests -p "test_content_factory_autopilot_ui.py" -v
