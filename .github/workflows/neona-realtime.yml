name: Neona realtime safety checks
on:
  pull_request:
    paths:
      - "neona_worker.py"
      - "neona_telegram_dialogs.py"
      - "neona_realtime_worker.py"
      - "tests/test_neona_realtime.py"
      - ".github/workflows/neona-realtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile changed Python modules
        run: python -m py_compile neona_worker.py neona_telegram_dialogs.py neona_realtime_worker.py tests/test_neona_realtime.py
      - name: Install minimal runtime dependencies
        run: python -m pip install "telethon==1.44.0" requests cryptography
      - name: Offline realtime safety tests
        run: python -m unittest discover -s tests -p "test_neona_realtime.py" -v
