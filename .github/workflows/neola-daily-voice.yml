name: Neola daily voice safety checks
on:
  pull_request:
    paths:
      - "neola_daily_brief.py"
      - "neola_partner_center.py"
      - "streamlit_app.py"
      - "tests/test_neola_daily_brief.py"
      - "tests/test_neola_voice_template.py"
      - ".github/workflows/neola-daily-voice.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile changed application modules
        run: python -m py_compile neola_daily_brief.py neola_partner_center.py streamlit_app.py tests/test_neola_daily_brief.py
      - name: Test daily spoken brief, calendar filtering and browser voice
        run: |
          python -m unittest discover -s tests -p "test_neola_daily_brief.py" -v
          python -m unittest discover -s tests -p "test_neola_voice_template.py" -v
